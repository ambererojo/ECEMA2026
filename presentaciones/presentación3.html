<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secuencia Cinematográfica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        font-family: 'Rajdhani', 'Segoe UI', sans-serif;
        cursor: pointer;
        user-select: none;
    }

    /* ---------- VIDEO: fondo fijo con deszoom + parallax, nunca se desenfoca ---------- */
    #starship {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;          /* starship1.mp4 es 1366x768 (16:9) */
        z-index: 0;
        opacity: 0;
        transform-origin: 50% 50%;
        will-change: transform;
        transition: opacity 1.2s ease;
    }
    #starship.on { opacity: 1; }

    #dim { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: #000; opacity: 0; }
    #vignette {
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%);
    }

    /* Resplandor cálido global cuando aparece el lanzallamas */
    #warm {
        position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0;
        mix-blend-mode: screen;
    }
    #warm::before {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(ellipse 55% 60% at 52% 34%, rgba(255,150,40,.42), rgba(255,90,10,.14) 55%, transparent 80%);
        animation: flicker 0.18s infinite alternate steps(2, end);
    }

    /* ---------- ESCENARIO 16:9 ajustado a cualquier pantalla ---------- */
    :root { --u: min(1vw, 1.7778vh); }   /* 1u = 1% del ancho del escenario */

    #stage {
        position: fixed; left: 50%; top: 50%;
        width: calc(var(--u) * 100);
        height: calc(var(--u) * 56.25);
        transform: translate(-50%, -50%);
        perspective: 1000px;
        z-index: 3;
    }
    #camera {
        position: absolute; inset: 0;
        transform-style: preserve-3d;
    }

    .actor {
        position: absolute;
        opacity: 0;
        will-change: transform, filter, opacity;
        pointer-events: none;
    }
    .actor img {
        width: 100%; height: 100%; display: block;
        -webkit-mask-image: linear-gradient(to bottom, #000 94%, transparent 100%);
                mask-image: linear-gradient(to bottom, #000 94%, transparent 100%);
    }

    /* musk1: ahora hacia la DERECHA de la pantalla */
    #actor1 {
        height: calc(var(--u) * 51);
        width:  calc(var(--u) * 113.2);
        left:   calc(var(--u) * 6.8);
        top:    calc(var(--u) * 9);
    }
    /* musk2: ahora hacia la IZQUIERDA (el lanzallamas apunta hacia la derecha) */
    #actor2 {
        height: calc(var(--u) * 59.5);
        width:  calc(var(--u) * 90.3);
        left:   calc(var(--u) * -8);
        top:    calc(var(--u) * -0.2);
    }

    /* Luz del lanzallamas sobre musk2 (en la boca del arma) */
    #muzzle {
        position: absolute;
        left: 66%; top: 31%;
        width: 55%; height: 75%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255,210,120,.75) 0%, rgba(255,140,30,.35) 30%, rgba(255,90,0,0) 65%);
        mix-blend-mode: screen;
        animation: flicker 0.14s infinite alternate steps(2, end);
        pointer-events: none;
    }

    /* ---------- TÍTULO estilo Star Wars ---------- */
    #title {
        position: fixed; left: 50%; top: 50%;
        z-index: 5; pointer-events: none;
        transform: translate(-50%, -50%);
        perspective: 700px;
        opacity: 0;
    }
    #titleWrap.enter { animation: titleIn 2.6s cubic-bezier(.16,.8,.2,1) both; }

    #titleText {
        font-family: 'Anton', 'Impact', 'Haettenschweiler', sans-serif;
        font-size: calc(var(--u) * 12.5);
        line-height: 1;
        letter-spacing: .09em;
        white-space: nowrap;
        text-transform: uppercase;
        color: #ffe81f;
        transform: rotateX(18deg) scaleX(1.12);
        -webkit-text-stroke: calc(var(--u) * .16) #b8860b;
        text-shadow:
            0 0 calc(var(--u) * 1.2) rgba(255,232,31,.55),
            0 calc(var(--u) * .25) 0 #c9a100,
            0 calc(var(--u) * .5) 0 #9a7a00,
            0 calc(var(--u) * .75) 0 #6e5600,
            0 calc(var(--u) * 1.1) calc(var(--u) * 1.4) rgba(0,0,0,.9);
    }

    /* ---------- CUADROS DE TEXTO (HUD espacial: marcos inclinados a la derecha + recuadro pequeño) ---------- */
    .hud {
        --k: calc(var(--u) * 2.8);            /* desplazamiento horizontal de la inclinación */
        --b: calc(var(--u) * .3);             /* grosor del marco */
        --hud-font: calc(var(--u) * 3.8);     /* tamaño de letra: bájalo si escribes textos largos */
        position: fixed; z-index: 6;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 0 calc(var(--u) * 1.2) var(--glow));
        transition: opacity .7s ease, transform .9s cubic-bezier(.16,.8,.2,1);
    }
    #box1.show, #box2.show { opacity: 1; transform: translateX(0); }

    .hud-frame {
        position: relative;
        min-height: calc(var(--u) * 13);
        background: var(--edge);
        clip-path: polygon(var(--k) 0, 100% 0, calc(100% - var(--k)) 100%, 0 100%);
    }
    .hud-frame::before {
        content: ""; position: absolute; inset: var(--b);
        background: var(--fill);
        clip-path: polygon(var(--k) 0, 100% 0, calc(100% - var(--k)) 100%, 0 100%);
    }
    .hud-text {
        position: relative;
        display: flex; align-items: center;
        min-height: calc(var(--u) * 13);
        padding: calc(var(--u) * 3.2) calc(var(--k) + var(--u) * 3.6);
        font-size: var(--hud-font);
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: .02em;
        color: var(--ink);
        text-shadow: 0 0 calc(var(--u) * 1) var(--glow);
    }

    /* Recuadro pequeño en la esquina superior izquierda, mismo formato inclinado */
    .hud-tag {
        position: absolute; z-index: 2;
        top: calc(var(--u) * -3.6); left: calc(var(--u) * 3);
        width: calc(var(--u) * 10); height: calc(var(--u) * 5);
        background: var(--edge);
        clip-path: polygon(calc(var(--k) * .55) 0, 100% 0, calc(100% - var(--k) * .55) 100%, 0 100%);
        opacity: 0;
        transition: opacity .5s ease .25s;
    }
    .hud-tag::before {
        content: ""; position: absolute; inset: var(--b);
        background: var(--fill);
        clip-path: polygon(calc(var(--k) * .55) 0, 100% 0, calc(100% - var(--k) * .55) 100%, 0 100%);
    }
    .hud-tag span {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        width: 100%; height: 100%;
        font-size: calc(var(--u) * 2.2);
        font-weight: 600;
        letter-spacing: .12em;
        color: var(--ink);
    }
    #box1.show .hud-tag, #box2.show .hud-tag { opacity: 1; }

    /* texto1: a la IZQUIERDA (musk1 está a la derecha; su mano queda a ~4u del cuadro, sin tocarlo) */
    #box1 {
        --edge: linear-gradient(135deg, #b4e8ff, #2f86c4 55%, #8fdcff);
        --fill: repeating-linear-gradient(to bottom, rgba(130,205,255,.06) 0 1px, transparent 1px 4px),
                linear-gradient(160deg, rgba(6,22,42,.9), rgba(3,10,22,.92));
        --glow: rgba(80,180,255,.6);
        --ink: #eaf6ff;
        left: calc(50% - var(--u) * 47);
        top:  calc(50% - var(--u) * 8);
        width: calc(var(--u) * 34);
        transform: translateX(calc(var(--u) * -3));
    }

    /* texto2: a la DERECHA, debajo de la llama; la luz del lanzallamas entra por la esquina superior izquierda */
    #box2 {
        --edge: linear-gradient(135deg, #fff0c4, #ff9a1f 50%, #ffd27a);
        --fill: radial-gradient(ellipse 110% 140% at -8% -25%, rgba(255,195,80,.65), rgba(255,120,20,.22) 50%, transparent 80%),
                linear-gradient(160deg, rgba(48,20,6,.92), rgba(14,7,3,.94));
        --glow: rgba(255,160,40,.7);
        --ink: #fff3d6;
        left: calc(50% + var(--u) * 4);
        top:  calc(50% + var(--u) * 2);
        width: calc(var(--u) * 42);
        transform: translateX(calc(var(--u) * 3));
        animation: hudFlame .16s infinite alternate steps(2, end);
    }

    /* ---------- BOTÓN DE INICIO ---------- */
    #startBtn {
        position: fixed; z-index: 100;
        left: 50%; top: 50%; transform: translate(-50%, -50%);
        padding: 16px 38px;
        font: 600 1.25rem 'Rajdhani', sans-serif;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: #fff;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 4px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: opacity .6s ease, background .3s ease;
    }
    #startBtn:hover { background: rgba(255,255,255,.18); }

    /* Indicador de sonido: solo aparece si el navegador bloqueó el audio o el archivo no lo trae */
    #sound {
        position: fixed; right: 18px; bottom: 16px; z-index: 50;
        padding: 8px 14px;
        font: 600 1rem 'Rajdhani', sans-serif;
        letter-spacing: .08em;
        color: #fff;
        background: rgba(0,0,0,.55);
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 4px;
        opacity: 0; pointer-events: none;
        transition: opacity .4s ease;
    }
    #sound.show { opacity: 1; pointer-events: auto; }

    @keyframes titleIn {
        0%   { opacity: 0; transform: scale(2.2); filter: blur(10px); }
        100% { opacity: 1; transform: scale(1);   filter: blur(0); }
    }
    @keyframes flicker {
        0%   { opacity: .72; }
        50%  { opacity: 1; }
        100% { opacity: .84; }
    }
    @keyframes hudFlame {
        0%   { filter: drop-shadow(0 0 calc(var(--u) * 1.4) rgba(255,150,30,.55)) brightness(1); }
        100% { filter: drop-shadow(0 0 calc(var(--u) * 2.8) rgba(255,185,60,.9)) brightness(1.16); }
    }
    @media (prefers-reduced-motion: reduce) {
        #muzzle, #warm::before, #box2 { animation: none; }
    }
</style>
</head>
<body>

    <video id="starship" src="starship1.mp4" loop playsinline preload="auto"></video>
    <div id="dim"></div>
    <div id="vignette"></div>
    <div id="warm"></div>

    <button id="startBtn">Iniciar secuencia</button>
    <div id="sound"></div>

    <div id="title"><div id="titleWrap"><div id="titleText">Elon Musk</div></div></div>

    <div id="stage">
        <div id="camera">
            <div id="actor1" class="actor"><img src="musk1.png" alt="Musk 1"></div>
            <div id="actor2" class="actor">
                <img src="musk2.png" alt="Musk 2">
                <div id="muzzle"></div>
            </div>
        </div>
    </div>

    <div id="box1" class="hud">
        <div class="hud-tag"><span>01</span></div>
        <div class="hud-frame"><div class="hud-text">texto1</div></div>
    </div>
    <div id="box2" class="hud">
        <div class="hud-tag"><span>02</span></div>
        <div class="hud-frame"><div class="hud-text">texto2</div></div>
    </div>

    <script>
    const $ = id => document.getElementById(id);
    const video = $('starship'), camera = $('camera');
    const actor1 = $('actor1'), actor2 = $('actor2');
    const title = $('title'), titleWrap = $('titleWrap');
    const box1 = $('box1'), box2 = $('box2');
    const dim = $('dim'), warm = $('warm'), soundBtn = $('sound');

    /* ================= CONFIGURACIÓN ================= */
    const TRANSITION_MS = 2400;     // duración de cada viaje de cámara
    const AUDIO_FADE_MS = 1200;     // subida progresiva del volumen
    const MAX_BLUR = 18;            // desenfoque máximo (px)
    const BLUR_PER_Z = 1 / 32;      // px de desenfoque por unidad de Z fuera de foco
    const BEHIND_FADE_START = 600;  // Z a partir del cual el objeto empieza a aparecer
    const BEHIND_FADE_END = 850;    // Z en el que está totalmente oculto (detrás de cámara)
    const PERSPECTIVE = 1000;

    /* Alejamiento infinito de los actores: crece sin parar pero cada vez más lento
       (logarítmico), así nunca se pierden de vista.  Z extra = DRIFT_AMP * ln(1 + t/DRIFT_TAU) */
    const DRIFT_AMP = 40;
    const DRIFT_TAU = 6;

    /* Estado s: 0 = Starship + título | 1 = Musk1 | 2 = Musk2
       Tablas [[s, valor], ...] con interpolación lineal.
       bottom = borde inferior del actor en unidades del escenario (se mantiene anclado al
       borde de pantalla mientras se aleja, para que no "flote" el recorte de las piernas). */
    const SCENE = [
        { el: actor1, focusZ: -100,
          z:  [[0, 880], [1, -100], [2, -520]],
          op: [[0, 1],   [1, 1],    [2, 0.45]],
          x:  [[0, 10],  [1, 0],    [2, 2]],
          y:  [[0, 0],   [1, 0],    [2, 3]] },
        { el: actor2, focusZ: -111,
          z:  [[0, 880], [1, 880],  [2, -111]],
          op: [[0, 1],   [2, 1]],
          x:  [[1, -6],  [2, 0]],
          y:  [[0, 0],   [2, 0]] }
    ];
    const TITLE_OPACITY = [[0, 1], [0.45, 0], [2, 0]];
    const TITLE_SCALE   = [[0, 1], [0.6, 0.22]];
    const DIM_OPACITY   = [[0, 0.12], [1, 0.38], [2, 0.5]];
    const WARM_OPACITY  = [[1.4, 0], [2, 1]];
    const VIDEO_ZOOM    = [[0, 1.24], [1, 1.15], [2, 1.09]];   // zoom de reposo por escena (se aleja en cada click)
    const VIDEO_INTRO   = 0.42;   // zoom extra al arrancar (parte en ~1.66 y se asienta en ~4 s)
    const VIDEO_PAR_X   = 5;      // parallax del mouse en % (±2.5 %)
    const VIDEO_PAR_Y   = 4;      // parallax vertical en % (±2 %)
    // Regla: (zoom mínimo − 1) / 2 debe ser mayor que el desplazamiento máximo, para que no se vean bordes

    /* ================= UTILIDADES ================= */
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

    function lerpTable(tab, s) {
        if (s <= tab[0][0]) return tab[0][1];
        for (let i = 1; i < tab.length; i++) {
            if (s <= tab[i][0]) {
                const [s0, v0] = tab[i-1], [s1, v1] = tab[i];
                return v0 + (v1 - v0) * (s - s0) / (s1 - s0);
            }
        }
        return tab[tab.length - 1][1];
    }

    /* ================= ESTADO ================= */
    let s = 0;                 // posición animada (0..2)
    let target = 0;            // escena destino
    let anim = null;           // { from, to, t0 }
    let started = false;
    let tStart = 0;
    let textTimer = null;
    const driftStart = [null, null];
    const mouse = { x: 0, y: 0, sx: 0, sy: 0 };

    const drift = (i, now) =>
        driftStart[i] == null ? 0 : DRIFT_AMP * Math.log(1 + (now - driftStart[i]) / 1000 / DRIFT_TAU);

    /* ================= AUDIO ================= */
    function fadeInAudio() {
        video.muted = false;
        video.volume = 0;
        const t0 = performance.now();
        (function step(now) {
            const k = clamp((now - t0) / AUDIO_FADE_MS, 0, 1);
            video.volume = k * k * (3 - 2 * k);   // smoothstep: sin golpe al inicio
            if (k < 1) requestAnimationFrame(step);
        })(t0);
    }

    function showSoundNote(msg) {
        soundBtn.textContent = msg;
        soundBtn.classList.add('show');
    }

    function unmute() {
        soundBtn.classList.remove('show');
        fadeInAudio();
    }

    // Diagnóstico: ¿el archivo realmente trae pista de audio?
    function checkAudioTrack() {
        setTimeout(() => {
            if (video.muted) return;
            if (typeof video.webkitAudioDecodedByteCount === 'number' && video.webkitAudioDecodedByteCount === 0 && !video.paused) {
                showSoundNote('🔇 starship1.mp4 no contiene pista de audio');
                console.warn('starship1.mp4 no tiene audio decodificado: revisa que el archivo incluya pista de audio (AAC/Opus).');
            }
        }, 2500);
    }

    async function startSequence() {
        started = true;
        tStart = performance.now();
        video.defaultMuted = false;
        video.muted = false;
        video.volume = 0;
        video.currentTime = 0;
        try {
            await video.play();
            fadeInAudio();
            checkAudioTrack();
        } catch (err) {
            // El navegador bloqueó el audio: reproducimos sin sonido y lo activamos en el siguiente click
            video.muted = true;
            try { await video.play(); } catch (_) {}
            showSoundNote('🔇 Click para activar el sonido');
        }
        video.classList.add('on');
        titleWrap.classList.add('enter');
        requestAnimationFrame(render);
    }

    /* ================= NAVEGACIÓN POR CLICK ================= */
    function goTo(n) {
        n = clamp(n, 0, 2);
        if (n === target || anim) return;
        target = n;
        if (n >= 1 && driftStart[n - 1] == null) driftStart[n - 1] = performance.now();
        anim = { from: s, to: n, t0: performance.now() };
        hideBoxes();
    }

    function hideBoxes() {
        clearTimeout(textTimer);
        box1.classList.remove('show');
        box2.classList.remove('show');
    }

    function showBoxFor(scene) {
        clearTimeout(textTimer);
        textTimer = setTimeout(() => {
            if (scene === 1) box1.classList.add('show');
            if (scene === 2) box2.classList.add('show');
        }, 180);   // casi al instante de asentarse la imagen
    }

    $('startBtn').addEventListener('click', e => {
        e.stopPropagation();
        e.target.style.opacity = '0';
        setTimeout(() => e.target.style.display = 'none', 600);
        startSequence();
    });

    soundBtn.addEventListener('click', e => {
        e.stopPropagation();
        video.muted = false;
        unmute();
    });

    document.addEventListener('click', () => {
        if (!started) return;
        if (video.muted) { video.muted = false; unmute(); }   // el click también sirve para liberar el audio
        goTo(target + 1);
    });
    document.addEventListener('keydown', e => {
        if (!started) return;
        if (['ArrowRight', ' ', 'Enter'].includes(e.key)) goTo(target + 1);
        if (e.key === 'ArrowLeft') goTo(target - 1);
    });
    document.addEventListener('mousemove', e => {
        mouse.x = e.clientX / innerWidth - .5;
        mouse.y = e.clientY / innerHeight - .5;
    });

    /* ================= RENDER ================= */
    function render(now) {
        if (anim) {
            const k = clamp((now - anim.t0) / TRANSITION_MS, 0, 1);
            s = anim.from + (anim.to - anim.from) * easeInOutCubic(k);
            if (k >= 1) {
                s = anim.to;
                anim = null;
                showBoxFor(target);
            }
        }

        const t = now / 1000;
        mouse.sx += (mouse.x - mouse.sx) * 0.05;
        mouse.sy += (mouse.y - mouse.sy) * 0.05;

        // Cámara: balanceo lento + seguimiento suave del mouse
        const rotX = Math.sin(t * 0.3) * 1.2 - mouse.sy * 2.2;
        const rotY = Math.cos(t * 0.2) * 1.2 + mouse.sx * 3.0;
        camera.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

        // VIDEO: arranca muy cerca y se asienta (como el título), deszoom en cada click,
        // deriva lenta, balanceo propio y parallax de mouse. Sin desenfoque.
        const since = (now - tStart) / 1000;
        const intro = VIDEO_INTRO * Math.pow(2, -5.5 * since / 4);
        const slow  = 0.03 * (1 - 1 / (1 + since / 25));
        const vz = lerpTable(VIDEO_ZOOM, s) + intro - slow;
        const vx = -mouse.sx * VIDEO_PAR_X + Math.sin(t * 0.23) * 0.4;
        const vy = -mouse.sy * VIDEO_PAR_Y + Math.cos(t * 0.17) * 0.3;
        video.style.transform = `translate3d(${vx.toFixed(3)}%, ${vy.toFixed(3)}%, 0) scale(${vz.toFixed(4)})`;

        // ACTORES 3D
        SCENE.forEach((item, i) => {
            const baseZ = lerpTable(item.z, s);
            const z = baseZ - drift(i, now);            // alejamiento infinito
            const x = lerpTable(item.x, s);
            const baseOp = lerpTable(item.op, s);

            // Aparece desde detrás de la cámara
            let vis = 1;
            if (baseZ >= BEHIND_FADE_END) vis = 0;
            else if (baseZ > BEHIND_FADE_START) vis = (BEHIND_FADE_END - baseZ) / (BEHIND_FADE_END - BEHIND_FADE_START);

            // Profundidad de campo: nítido en su foco (la deriva lenta no lo desenfoca)
            const blur = Math.min(MAX_BLUR, Math.abs(baseZ - item.focusZ) * BLUR_PER_Z);

            const y = lerpTable(item.y, s);

            item.el.style.opacity = vis * baseOp;
            item.el.style.filter = blur > 0.15 ? `blur(${blur.toFixed(2)}px)` : 'none';
            item.el.style.transform =
                `translate3d(calc(var(--u) * ${x.toFixed(3)}), calc(var(--u) * ${y.toFixed(3)}), ${z.toFixed(2)}px)`;
        });

        // Título: se aleja hacia el fondo y se desvanece, estilo crawl
        const tOp = lerpTable(TITLE_OPACITY, s);
        const tSc = lerpTable(TITLE_SCALE, s);
        title.style.opacity = tOp;
        title.style.transform = `translate(-50%, -50%) scale(${tSc.toFixed(3)}) translateY(${((1 - tSc) * -18).toFixed(2)}vh)`;

        dim.style.opacity = lerpTable(DIM_OPACITY, s);
        warm.style.opacity = lerpTable(WARM_OPACITY, s);

        requestAnimationFrame(render);
    }
    </script>
</body>
</html>
